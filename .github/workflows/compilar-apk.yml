name: Compilar APK camScaneador

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar
        run: |
          base64 -d app/firma.keystore.b64 > app/firma.keystore
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk camScaneador.apk
      - uses: actions/upload-artifact@v4
        with:
          name: camScaneador-apk
          path: camScaneador.apk
