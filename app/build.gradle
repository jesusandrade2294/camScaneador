plugins {
    id 'com.android.application'
}

android {
    namespace 'com.camscaneador.app'
    compileSdk 34

    signingConfigs {
        firma {
            storeFile file('firma.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.camscaneador.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.firma
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Unifica versiones de Kotlin que traen las librerías (evita clases duplicadas)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    // Reconocimiento de texto (OCR) sin internet, modelo incluido en la app
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
